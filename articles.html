<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Israel Home For You | חדשות ותובנות מקצועיות</title>
<meta name="description" content="מאמרים עדכניים על נדל&quot;ן, משכנתאות והשקעות בישראל.">
<link rel="icon" href="images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--ink:#1B5F9E;--paper:#F5FAFF;--line:#D5E3F0;--text:#3C4A63;--sun:#F6CF49;--sun-hover:#EFC02C;
  --gold:linear-gradient(135deg,#B8892B 0%,#F1D27A 45%,#D4AF37 70%,#A9781F 100%)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Assistant","Heebo",system-ui,sans-serif;background:#fff;color:var(--navy);line-height:1.6}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(16px,4vw,48px);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand img{display:block;height:44px;width:auto}
.top .end{display:flex;align-items:center;gap:18px}
.back{font-weight:700;text-decoration:none;color:var(--ink)}
.lang-sw{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;color:#8aa0b8}
.lang-sw button{border:0;background:none;font:inherit;color:var(--navy);cursor:pointer;padding:4px 2px;opacity:.55}
.lang-sw button[aria-current="true"]{opacity:1;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#D4AF37;text-decoration-thickness:2px}
.hero{padding:clamp(48px,7vw,96px) clamp(16px,5vw,80px) clamp(28px,4vw,48px);background:var(--paper);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto}
.eyebrow{font-size:13.5px;font-weight:800;letter-spacing:.08em;color:var(--ink);margin-bottom:12px}
h1{font-size:clamp(32px,4.4vw,56px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
h1 b{color:var(--ink)}
.rule{display:block;width:76px;height:4px;margin:20px 0;border-radius:2px;background:var(--gold)}
.lead{max-width:60ch;font-size:clamp(17px,1.4vw,20px);color:var(--navy)}
.toc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:clamp(24px,3vw,36px)}
.toc a{display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:10px;text-decoration:none;transition:border-color .25s,transform .25s}
.toc a:hover{border-color:#D4AF37;transform:translateY(-2px)}
.toc .cat{font-size:12.5px;font-weight:800;color:var(--ink)}
.toc .t{font-weight:700;line-height:1.35}
main{padding:clamp(24px,4vw,56px) clamp(16px,5vw,80px) clamp(56px,7vw,96px)}
article{max-width:760px;margin:0 auto;padding:clamp(36px,5vw,64px) 0;border-bottom:1px solid var(--line);scroll-margin-top:84px}
article:last-of-type{border-bottom:0}
article .cover{display:block;width:100%;height:auto;aspect-ratio:16/8;object-fit:cover;border-radius:12px;margin-bottom:24px}
.meta{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--text);margin-bottom:10px}
.meta .cat{padding:4px 10px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:800;font-size:12.5px}
article h2{font-size:clamp(25px,2.6vw,34px);font-weight:800;line-height:1.2;letter-spacing:-.01em;margin-bottom:16px}
article p{font-size:18px;color:var(--navy);margin-bottom:14px}
article ul{margin:0 0 16px;padding-inline-start:0;list-style:none}
article li{position:relative;padding-inline-start:22px;margin-bottom:8px;font-size:18px}
article li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.cta{margin-top:20px;display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:8px 24px;border-radius:2px;background:var(--sun);color:var(--navy);font-weight:800;text-decoration:none}
.cta:hover{background:var(--sun-hover)}
.note{max-width:760px;margin:24px auto 0;font-size:14px;color:var(--text)}
footer{padding:28px clamp(16px,5vw,80px);background:var(--navy);color:#fff;text-align:center;font-size:14px}
footer a{color:#F1D27A}
@media (max-width:860px){.toc{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.toc{grid-template-columns:1fr}.back{display:none}.top .brand img{height:36px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" id="homeLink" href="index.html"><img src="images/logo-ih4u-on-light.png" alt="IH4U Israel Home For You" width="528" height="173"></a>
  <div class="end">
    <a class="back" id="backLink" href="index.html#articles"></a>
    <div class="lang-sw" role="group" aria-label="Language"><button type="button" data-lang="he">HE</button><span aria-hidden="true">·</span><button type="button" data-lang="en">EN</button><span aria-hidden="true">·</span><button type="button" data-lang="fr">FR</button></div>
  </div>
</header>
<section class="hero">
  <div class="wrap">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <i class="rule" aria-hidden="true"></i>
    <p class="lead" id="lead"></p>
    <nav class="toc" id="toc"></nav>
  </div>
</section>
<main id="list"></main>
<footer><span id="foot"></span> · <a id="footHome" href="index.html">Israel Home For You</a></footer>
<script src="articles-data.js"></script>
<script>
(function(){
  var A = window.IH4U_ARTICLES || [], LANGS = ['he','en','fr'];
  var T = {
    he: { title:'חדשות <b>ותובנות מקצועיות</b>', eyebrow:'חדשות ותובנות מקצועיות', lead:'מאמרים עדכניים על נדל"ן, משכנתאות והשקעות בישראל, כדי להציג ידע מקצועי עדכני ולתת לכם מידע שימושי לפני כל החלטה.', back:'→ חזרה לאתר', cta:'לתיאום פגישת ייעוץ', note:'המאמרים נועדו למידע כללי בלבד ואינם מחליפים ייעוץ אישי. לפרטים המתאימים למצב שלכם, דברו איתנו.', foot:'© Israel Home For You', doc:'Israel Home For You | חדשות ותובנות מקצועיות', wa:'שלום, קראתי מאמר באתר ואשמח לתאם פגישת ייעוץ.' },
    en: { title:'Latest News <b>& Expert Insights</b>', eyebrow:'Latest News & Expert Insights', lead:'Up-to-date articles on real estate, mortgages and investment in Israel, sharing our expertise and giving you useful information before every decision.', back:'← Back to the site', cta:'Book a Consultation', note:'These articles are for general information only and are not a substitute for personal advice. For guidance tailored to your situation, talk to us.', foot:'© Israel Home For You', doc:'Israel Home For You | Latest News & Expert Insights', wa:'Hello, I read an article on your website and would like to book a consultation.' },
    fr: { title:'Actualités <b>et analyses d’experts</b>', eyebrow:'Actualités et analyses d’experts', lead:'Des articles à jour sur l’immobilier, le crédit et l’investissement en Israël, pour partager notre expertise et vous éclairer avant chaque décision.', back:'← Retour au site', cta:'Prendre rendez-vous', note:'Ces articles sont fournis à titre d’information générale et ne remplacent pas un conseil personnalisé. Pour une analyse adaptée à votre situation, contactez-nous.', foot:'© Israel Home For You', doc:'Israel Home For You | Actualités et analyses d’experts', wa:'Bonjour, j’ai lu un article sur votre site et je souhaiterais prendre rendez-vous.' }
  };
  /* Hebrew and English go to Malki, French goes to Joanne (same rule as the homepage) */
  var WA = { he:'972544991022', en:'972544991022', fr:'972587480641' };
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pick(){
    var m = /(?:^|[?&])lang=(he|en|fr)(?:&|$)/.exec(location.search); if (m) return m[1];
    try { var s = localStorage.getItem('ih4u-lang'); if (LANGS.indexOf(s) > -1) return s; } catch (e) {}
    return 'he';
  }
  function fmtDate(d, L){
    try { return new Date(d + 'T12:00:00').toLocaleDateString(L === 'he' ? 'he-IL' : L === 'fr' ? 'fr-FR' : 'en-GB', { day:'numeric', month:'long', year:'numeric' }); } catch (e) { return d; }
  }
  function render(L, keepHash){
    var t = T[L], h = '', toc = '';
    document.documentElement.lang = L; document.documentElement.dir = L === 'he' ? 'rtl' : 'ltr';
    document.title = t.doc;
    document.getElementById('eyebrow').textContent = t.eyebrow;
    document.getElementById('title').innerHTML = t.title;
    document.getElementById('lead').textContent = t.lead;
    document.getElementById('backLink').textContent = t.back;
    document.getElementById('backLink').href = 'index.html?lang=' + L + '#articles';
    document.getElementById('homeLink').href = 'index.html?lang=' + L;
    document.getElementById('footHome').href = 'index.html?lang=' + L;
    document.getElementById('foot').textContent = t.foot;
    A.forEach(function(a){
      toc += '<a href="#' + a.slug + '"><span class="cat">' + esc(a.cat[L]) + '</span><span class="t">' + esc(a.title[L]) + '</span></a>';
      var body = '', inList = false;
      a.body[L].forEach(function(p){
        if (p.indexOf('• ') === 0){ if (!inList){ body += '<ul>'; inList = true; } body += '<li>' + esc(p.slice(2)) + '</li>'; }
        else { if (inList){ body += '</ul>'; inList = false; } body += '<p>' + esc(p) + '</p>'; }
      });
      if (inList) body += '</ul>';
      h += '<article id="' + a.slug + '"><img class="cover" src="' + a.img + '" alt="" loading="lazy" width="1200" height="600">' +
        '<div class="meta"><span class="cat">' + esc(a.cat[L]) + '</span><time datetime="' + a.date + '">' + fmtDate(a.date, L) + '</time></div>' +
        '<h2>' + esc(a.title[L]) + '</h2>' + body +
        '<a class="cta" target="_blank" rel="noopener" href="https://wa.me/' + WA[L] + '?text=' + encodeURIComponent(t.wa) + '">' + esc(t.cta) + '</a></article>';
    });
    h += '<p class="note">' + esc(t.note) + '</p>';
    document.getElementById('toc').innerHTML = toc;
    document.getElementById('list').innerHTML = h;
    var b = document.querySelectorAll('.lang-sw button');
    for (var i = 0; i < b.length; i++){ if (b[i].getAttribute('data-lang') === L) b[i].setAttribute('aria-current', 'true'); else b[i].removeAttribute('aria-current'); }
    if (keepHash && location.hash){ var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.lang-sw button[data-lang]'); if (!b) return;
    var L = b.getAttribute('data-lang');
    try { localStorage.setItem('ih4u-lang', L); } catch (err) {}
    try { var u = new URL(location.href); u.searchParams.set('lang', L); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (err) {}
    render(L, false);
  });
  render(pick(), true);
})();
</script>
</body>
</html>
